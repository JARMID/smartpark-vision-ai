<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="g3_shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="g3_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="g3_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#020617"/>
  <g transform="translate(256, 240)">
    <!-- Heavy Security Shield -->
    <path d="M0 -140 L130 -90 C130 50, 80 140, 0 190 C-80 140, -130 50, -130 -90 Z" 
          fill="url(#g3_shield)" stroke="url(#g3_border)" stroke-width="16" stroke-linejoin="round"/>
    <!-- Golden Sovereign Star Atop Shield -->
    <path d="M0 -170 L14 -145 L40 -140 L20 -122 L26 -95 L0 -110 L-26 -95 L-20 -122 L-40 -140 L-14 -145 Z" fill="url(#g3_gold)"/>
    <!-- Vehicle Front Grille & Headlight Horizon -->
    <path d="M-70 10 L-40 -35 L40 -35 L70 10 L55 55 L-55 55 Z" fill="#0F172A" stroke="#E2E8F0" stroke-width="10" stroke-linejoin="round"/>
    <!-- Twin Cyan LED Headlights -->
    <ellipse cx="-45" cy="15" rx="14" ry="7" fill="#00F2FE"/>
    <ellipse cx="45" cy="15" rx="14" ry="7" fill="#00F2FE"/>
    <!-- Biometric Keyhole / Barrier Beam -->
    <path d="M-60 85 L60 85" stroke="#10B981" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>